display_name: Codex Obsidian Read
short_description: Controller-led local-library intake, literature search, authorized PDF acquisition, Zotero, and Obsidian/RAG notes.
default_prompt: Use this skill to run a small controller-mediated literature workflow. Select a project profile, ask whether sources are local PDFs, search/download, or mixed, initialize controller, dependency setup, and agent worklogs, default literature discovery/screening to academic-research-suite, keep research-lr-ra auxiliary/fallback, check the permanent Python environment, prefer sciencedirect-live-session-fetcher for authorized publisher PDF downloads when installed, then dispatch fixed specialist sessions instead of doing everything in one agent.
