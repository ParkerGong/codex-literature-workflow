display_name: Codex Literature Workflow
short_description: Controller-led local-library intake, literature search, authorized PDF acquisition, Zotero, and Obsidian/RAG notes.
default_prompt: Use this skill to run a controller-mediated literature workflow. Explicitly designate one session as the Controller Console, attach a goal for long work, initialize controller/dependency/session/Git checkpoint records, ask the user for required startup scope before any search/download/Zotero/Obsidian/PDF-reading work, recommend installing or enabling needed companion skills/plugins during setup, create or reuse fixed LiteratureAgent/ZoteroAgent/ObsidianAgent sessions as needed, default literature discovery/screening to academic-research-suite, keep research-lr-ra auxiliary/fallback, check the permanent Python environment, force local Git checkpoint commits after initialization/scope/dependency/session records and every 3 meaningful file-writing steps or accepted handoffs, prefer sciencedirect-live-session-fetcher for authorized publisher PDF downloads when installed, then dispatch bounded specialist tasks instead of doing everything in one agent.
